# Envoie les notifications des cultes à tous les téléphones abonnés (OneSignal).
# Chaque matin à 5 h (Kinshasa), programme les notifications des cultes du jour : 30 min avant et au début.
# Bouton « Run workflow » : envoyer tout de suite une annonce spéciale (remplir « message »).
name: Notifications des cultes

on:
  schedule:
    - cron: "0 4 * * *" # 4 h UTC = 5 h à Kinshasa
  workflow_dispatch:
    inputs:
      message:
        description: "Annonce à envoyer maintenant (laisser vide pour programmer les cultes du jour)"
        required: false
        default: ""
      titre:
        description: "Titre de l'annonce"
        required: false
        default: "EGRADI TV"

jobs:
  notifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python notifier_cultes.py
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID || secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          MESSAGE: ${{ github.event.inputs.message }}
          TITRE: ${{ github.event.inputs.titre }}
