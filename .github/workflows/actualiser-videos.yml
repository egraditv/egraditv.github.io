# Met à jour la liste des vidéos (videos.js) depuis la chaîne YouTube, plusieurs fois par jour.
name: Actualiser les vidéos

on:
  schedule:
    - cron: "15 */4 * * *" # toutes les 4 heures
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write

jobs:
  actualiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python actualiser_videos.py
      - name: Enregistrer si la liste a changé
        run: |
          if git diff --quiet videos.js; then
            echo "Aucune nouvelle vidéo."
          else
            python -c "import re,pathlib; p=pathlib.Path('sw.js'); p.write_text(re.sub(r'egradi-tv-(\d+)', lambda m: f'egradi-tv-{int(m[1])+1}', p.read_text(encoding='utf-8')), encoding='utf-8')"
            git config user.name "EGRADI TV (robot)"
            git config user.email "actions@users.noreply.github.com"
            git add videos.js sw.js
            git commit -m "Nouvelles vidéos YouTube"
            git push
          fi
